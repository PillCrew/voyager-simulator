    <script>
      const isVR = AFRAME && AFRAME.utils && AFRAME.utils.device && (AFRAME.utils.device.isMobileVR() || navigator.userAgent.includes('Oculus') || navigator.userAgent.includes('Quest'));
      const starsEl = document.getElementById('stars');
      if (starsEl) {
        if (isVR) {
          starsEl.setAttribute('star-system', 'numStars: 50; size: 4000');
        } else {
          starsEl.setAttribute('star-system', 'numStars: 800; size: 6000');
        }
      }
      const camera = document.querySelector('a-camera');
      if (camera) {
        if (isVR) {
          camera.setAttribute('fov', '90');
        } else {
          camera.setAttribute('fov', '75');
        }
      }
    </script>
